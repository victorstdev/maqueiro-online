<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Monitoramento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 min-h-screen">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold">📊 Painel de Controle Operacional</h1>
            <p class="text-xs text-slate-400">Visão Exclusiva da Administração</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-800">
                <h3 class="text-sm font-bold text-sky-400 mb-3">⏳ Chamados Pendentes</h3>
                <div id="coluna-pendentes" class="space-y-3"></div>
            </div>
            <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-800">
                <h3 class="text-sm font-bold text-amber-400 mb-3">🏃 Em Transporte</h3>
                <div id="coluna-andamento" class="space-y-3"></div>
            </div>
        </div>

        <div class="bg-slate-800/20 border border-slate-800 p-5 rounded-xl">
            <h3 class="text-base font-bold mb-3">👥 Modificar Permissões da Equipe</h3>
            <table class="w-full text-left text-xs text-slate-300">
                <thead>
                    <tr class="border-b border-slate-800 text-slate-500 uppercase">
                        <th class="pb-2">Profissional</th>
                        <th class="pb-2">Nível de Acesso</th>
                        <th class="pb-2 text-right">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-cargos"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="central.js"></script>
</body>
</html>
