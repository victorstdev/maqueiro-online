<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Admin - E-Maqueiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        industrial: { bg: '#f3f4f6', surface: '#ffffff', nav: '#1e293b', text: '#0f172a', muted: '#64748b' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
</head>
<body class="bg-industrial-bg text-industrial-text font-sans antialiased">
    <div id="notification-container"></div>
    
    <nav class="bg-industrial-nav h-[60px] px-8 flex items-center gap-6 shadow-sm">
        <a href="criar_chamado.html" class="text-slate-400 hover:text-white text-sm font-medium transition-colors h-full flex items-center px-1">Novo Chamado</a>
        <a href="lista_chamados.html" class="text-slate-400 hover:text-white text-sm font-medium transition-colors h-full flex items-center px-1">Painel de Chamados</a>
        <a href="central.html" class="text-white text-sm font-medium transition-colors border-b-2 border-white h-full flex items-center px-1">Central Admin</a>
        <a href="configuracoes.html" class="text-slate-400 hover:text-white text-sm font-medium transition-colors h-full flex items-center px-1">Configurações</a>
        <button onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" class="ml-auto bg-transparent text-slate-100 text-sm py-2 px-4 rounded hover:bg-white/10 transition-colors">Sair</button>
    </nav>

    <main class="max-w-[1200px] mx-auto mt-10 px-6">
        <section class="bg-industrial-surface rounded-md shadow-md p-8">
            <h2 class="text-2xl font-bold tracking-tight mb-1">Central de Administração</h2>
            <p class="text-industrial-muted text-sm mb-8">Controle métricas e atribua perfis de segurança</p>
            
            <div class="grid grid-cols-3 gap-6 mb-10">
                <div class="bg-slate-50 p-6 rounded-md text-center">
                    <h3 class="text-[11px] font-bold uppercase text-industrial-muted tracking-wider mb-1">Abertos</h3>
                    <p id="metric-abertos" class="text-3xl font-extrabold">0</p>
                </div>
                <div class="bg-slate-50 p-6 rounded-md text-center">
                    <h3 class="text-[11px] font-bold uppercase text-industrial-muted tracking-wider mb-1">Em Andamento</h3>
                    <p id="metric-andamento" class="text-3xl font-extrabold">0</p>
                </div>
                <div class="bg-slate-50 p-6 rounded-md text-center">
                    <h3 class="text-[11px] font-bold uppercase text-industrial-muted tracking-wider mb-1">Concluídos</h3>
                    <p id="metric-concluidos" class="text-3xl font-extrabold">0</p>
                </div>
            </div>

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                <h3 class="text-base font-bold">Gerenciamento de Perfis</h3>
                <input type="text" id="input-pesquisa" oninput="filtrarUsuarios()" placeholder="Pesquisar por e-mail..." class="text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:bg-white focus:border-blue-500 w-full md:w-[300px] transition-all">
            </div>

            <div class="w-full overflow-x-auto">
                <table class="w-full border-collapse text-left text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-[11px] font-bold uppercase tracking-wider text-industrial-muted">
                            <th class="p-4">Email</th>
                            <th class="p-4">Perfil</th>
                            <th class="p-4">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios-corpo">
                        <tr><td colspan="3" class="p-4 text-industrial-muted">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/supabase-config.js"></script>
    <script>
        let usuarioLogadoId = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            
            usuarioLogadoId = session.user.id;
            const perfil = await obterPerfilUsuario(usuarioLogadoId);
            if (perfil !== 'ADMIN') { window.location.href = "lista_chamados.html"; return; }

            carregarMetricas();
            carregarUsuarios();
            configurarRealtimeCentral();
        });

        async function carregarMetricas() {
            const { data } = await supabaseClient.from('chamado').select('status');
            if(data) {
                document.getElementById('metric-abertos').innerText = data.filter(c => c.status === 'aberto').length;
                document.getElementById('metric-andamento').innerText = data.filter(c => c.status === 'em_andamento').length;
                document.getElementById('metric-concluidos').innerText = data.filter(c => c.status === 'concluido').length;
            }
        }

        async function carregarUsuarios() {
            // Agora buscando o e-mail também
            const { data } = await supabaseClient.from('perfil_acesso').select('usuario_id, perfil, email');
            
            if (data) {
                listaUsuariosLocal = data;
                renderizarTabelaUsuarios(listaUsuariosLocal);
            }
        }

        function renderizarTabelaUsuarios(usuarios) {
            const tbody = document.getElementById('tabela-usuarios-corpo');
            tbody.innerHTML = "";

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-industrial-muted text-xs">Nenhum funcionário localizado.</td></tr>`;
                return;
            }

            usuarios.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 text-slate-700 hover:bg-slate-50/50 transition-colors";
                const ehOProprio = user.usuario_id === usuarioLogadoId;
                const disabledStr = ehOProprio ? 'disabled' : '';
                
                // Fallback amigável caso o e-mail antigo de algum teste tenha ficado nulo
                const exibicaoEmail = user.email || `ID Sem E-mail (${user.usuario_id.substring(0,8)}...)`;

                tr.innerHTML = `
                    <td class="p-4 font-medium text-industrial-text">
                        ${exibicaoEmail} ${ehOProprio ? '<span class="ml-2 bg-slate-900 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">VOCÊ</span>':''}
                    </td>
                    <td class="p-4">
                        <select onchange="alterarPerfil('${user.usuario_id}', this.value)" ${disabledStr} class="text-xs p-2 bg-white border border-slate-200 rounded-md focus:outline-none focus:border-blue-500 disabled:opacity-40 cursor-pointer">
                            <option value="SOLICITANTE" ${user.perfil === 'SOLICITANTE'?'selected':''}>SOLICITANTE</option>
                            <option value="MAQUEIRO" ${user.perfil === 'MAQUEIRO'?'selected':''}>MAQUEIRO</option>
                            <option value="ADMIN" ${user.perfil === 'ADMIN'?'selected':''}>ADMIN</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <button onclick="removerUsuario('${user.usuario_id}')" ${disabledStr} class="text-red-500 font-semibold text-xs hover:text-red-700 disabled:opacity-30 transition-colors">Remover</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarUsuarios() {
            const termo = document.getElementById('input-pesquisa').value.toLowerCase().trim();
            
            if (!termo) {
                renderizarTabelaUsuarios(listaUsuariosLocal);
                return;
            }

            const filtrados = listaUsuariosLocal.filter(u => {
                const emailAlvo = u.email ? u.email.toLowerCase() : '';
                return emailAlvo.includes(termo);
            });

            renderizarTabelaUsuarios(filtrados);
        }

        function configurarRealtimeCentral() {
            supabaseClient.channel('central-sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'chamado' }, () => carregarMetricas())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'perfil_acesso' }, () => carregarUsuarios())
                .subscribe();
        }

        async function alterarPerfil(userId, novoPerfil) {
            await supabaseClient.from('perfil_acesso').update({ perfil: novoPerfil }).eq('usuario_id', userId);
            mostrarNotificacao("Perfil modificado!", "sucesso");
        }

        async function removerUsuario(userId) {
            if (!confirm("Remover acesso do usuário?")) return;
            await supabaseClient.from('perfil_acesso').delete().eq('usuario_id', userId);
            mostrarNotificacao("Usuário deletado.", "info");
            carregarUsuarios();
        }
    </script>
</body>
</html>
