<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Maqueiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        industrial: { bg: '#f3f4f6', surface: '#ffffff', nav: '#1e293b', text: '#0f172a', muted: '#64748b' },
                        clinico: { info: '#3b82f6' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-industrial-bg text-industrial-text font-sans antialiased">
    <div id="notification-container"></div>

    <section class="max-w-[420px] mx-auto mt-24 p-10 bg-industrial-surface rounded-md shadow-md">
        <h2 class="text-2xl font-bold tracking-tight mb-1">Acessar o System</h2>
        <p class="text-industrial-muted text-sm mb-8">Identifique-se para gerenciar os chamados</p>
        
        <form id="form-login" class="flex flex-col gap-5">
            <div class="flex flex-col gap-1.5">
                <label class="text-[11px] font-semibold uppercase tracking-wider text-industrial-muted">E-mail Corporativo</label>
                <input type="email" id="login-email" required class="w-full text-sm p-3 bg-slate-50 border border-slate-200 rounded-md text-industrial-text focus:outline-none focus:bg-white focus:border-clinico-info focus:ring-4 focus:ring-blue-500/15 transition-all">
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[11px] font-semibold uppercase tracking-wider text-industrial-muted">Senha</label>
                <input type="password" id="login-senha" required class="w-full text-sm p-3 bg-slate-50 border border-slate-200 rounded-md text-industrial-text focus:outline-none focus:bg-white focus:border-clinico-info focus:ring-4 focus:ring-blue-500/15 transition-all">
            </div>
            <button type="submit" class="w-full bg-industrial-text hover:bg-slate-800 text-white font-semibold p-3.5 rounded-md text-sm transition-colors">Entrar</button>
        </form>
        <p class="mt-6 text-center text-sm text-industrial-muted">Não tem uma conta? <a href="cadastro.html" class="text-clinico-info hover:underline">Cadastre-se aqui</a></p>
    </section>

    <script src="js/supabase-config.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: senha });
            
            if (error) {
                mostrarNotificacao(error.message, "erro");
            } else {
                const perfil = await obterPerfilUsuario(data.user.id);
                if (perfil === 'SOLICITANTE') {
                    window.location.href = "criar_chamado.html";
                } else {
                    window.location.href = "lista_chamados.html";
                }
            }
        });
    </script>
</body>
</html>
