<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Fila de Macas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div id="container-notificacao" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>
    <div class="max-w-md w-full bg-white rounded-2xl p-8 shadow-xl space-y-6">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-800">Hospital São Matheus</h2>
            <p class="text-sm text-slate-500 mt-1">Login no sistema de chamados</p>
        </div>
        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">E-mail</label>
                <input type="email" id="email" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500 text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Senha</label>
                <input type="password" id="senha" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500 text-sm" required>
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors text-sm shadow-md">Entrar no Sistema</button>
        </form>
        <p class="text-center text-xs text-slate-400">Não tem acesso? <a href="cadastro.html" class="text-blue-500 font-semibold hover:underline">Cadastre-se</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
