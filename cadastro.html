<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div id="container-notificacao" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>
    <div class="max-w-md w-full bg-white rounded-2xl p-8 shadow-xl space-y-6">
        <h2 class="text-xl font-bold text-slate-800 text-center">Criar Nova Conta</h2>
        <form id="form-cadastro" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">E-mail</label>
                <input type="email" id="email" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none" required>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Senha de Acesso</label>
                <input type="password" id="senha" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none" required>
            </div>
            <button type="submit" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition-colors">Salvar</button>
        </form>
        <a href="index.html" class="block text-center text-xs text-slate-400 hover:underline">Voltar ao Login</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/cadastro.js"></script>
</body>
</html>
